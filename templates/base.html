<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ФК Марев Старс</title>
    <link rel="icon" type="image/png" sizes="64x64" href="{% static 'images/favicon.ico.png' %}">
    <link rel="shortcut icon" type="image/png" href="{% static 'images/favicon.ico.png' %}">
    <link rel="icon" href="{% static 'images/favicon.ico.png' %}" sizes="any">
    <style>
        :root {
            --blue: #0f2d52;
            --gold: #d4af37;
            --gold-soft: #f2d57a;
            --bg: #0b1017;
            --bg-2: #121a24;
            --panel: #141d27;
            --panel-strong: #0e151d;
            --text: #edf3f8;
            --muted: #a9b5c2;
            --line: rgba(255,255,255,0.08);
            --shadow: 0 18px 40px rgba(0,0,0,0.35);
        }

        * { box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body {
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(180deg, #071018 0%, #0d1722 100%);
            color: var(--text);
            min-height: 100vh;
        }

        a { color: inherit; }

        nav {
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(6, 10, 15, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--line);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 42px;
            gap: 20px;
        }

        nav a {
            color: #dfe8f2;
            text-decoration: none;
            margin: 0 12px;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.02em;
            transition: color 0.2s ease;
        }

        nav a:hover {
            color: var(--gold-soft);
        }

        .logo-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .logo-img {
            height: 46px;
            width: auto;
            display: block;
        }

        .logo-text {
            font-size: clamp(1.1rem, 2vw, 1.8rem);
            font-weight: 800;
            color: var(--gold-soft);
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .nav-links {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        .user-section { display: flex; align-items: center; gap: 15px; color: white; }
        .btn-gold {
            background: var(--gold);
            color: #101418 !important;
            padding: 10px 18px;
            border-radius: 6px;
            font-weight: 700;
            text-decoration: none;
            border: 1px solid rgba(0,0,0,0.12);
        }
        .msg {
            padding: 15px 18px;
            margin: 22px auto;
            max-width: 900px;
            border-radius: 8px;
            background: rgba(18, 42, 28, 0.82);
            color: #b7efc7;
            border: 1px solid rgba(82, 179, 110, 0.45);
        }

        .auth-container {
            background: rgba(20, 29, 39, 0.95);
            border: 1px solid var(--line);
            border-top: 4px solid var(--blue);
            padding: 30px;
            border-radius: 12px;
            max-width: 450px;
            margin: 40px auto;
            box-shadow: var(--shadow);
        }

        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--gold-soft);
            font-size: 14px;
            font-weight: 700;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 12px 14px;
            background: #0e141b;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 8px;
            color: white;
            box-sizing: border-box;
            font: inherit;
        }
        .form-group input:focus, .form-group textarea:focus {
            border-color: var(--gold);
            outline: none;
            box-shadow: 0 0 0 3px rgba(212,175,55,0.15);
        }
        .btn-submit {
            background: var(--blue);
            color: white;
            border: none;
            padding: 14px 18px;
            width: 100%;
            font-size: 16px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s ease, background 0.2s ease;
        }
        .btn-submit:hover {
            background: #143d67;
            transform: translateY(-1px);
        }

        .approval-alert {
            background: var(--gold);
            color: #111;
            padding: 12px 16px;
            text-align: center;
            font-weight: 700;
            border-bottom: 1px solid rgba(0,0,0,0.12);
        }
        .approval-alert a {
            color: #111;
            text-decoration: underline;
            font-weight: 800;
        }

        main {
            padding: 40px 24px 70px;
            max-width: 1200px;
            margin: 0 auto;
        }
    </style>
</head>
<body>

<nav>
    <div class="logo-wrap">
        <img src="{% static 'images/logo.png' %}" alt="MAREV STARS logo" class="logo-img">
        <div class="logo-text">MAREV STARS</div>
    </div>
    <div class="nav-links">
        <a href="{% url 'team:home' %}">Начало</a>
        <a href="{% url 'team:schedule' %}">Тренировки</a>
        <a href="{% url 'team:coaches' %}">Треньори</a>
        <a href="{% url 'team:contact' %}">Контакти</a>

        {% if user.is_authenticated and user.is_staff or user.is_superuser %}
            <a href="{% url 'team:staff_dashboard' %}" style="color: var(--gold-soft); font-weight: 800; border-left: 1px solid var(--line); padding-left: 15px;">
                 Staff Portal
            </a>
        {% endif %}
    </div>
</nav>



{% if messages %}
    {% for message in messages %}
        <div class="msg">{{ message }}</div>
    {% endfor %}
{% endif %}

<main style="padding: 40px; max-width: 1200px; margin: 0 auto;">
    {% block content %} {% endblock %}
</main>


</body>
</html>
