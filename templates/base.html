<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ФК Марев Старс</title>
    <link rel="icon" type="image/png" sizes="64x64" href="{% static 'images/favicon.ico.png' %}">
    <link rel="shortcut icon" type="image/png" href="{% static 'images/favicon.ico.png' %}">
    <link rel="icon" href="{% static 'images/favicon.ico.png' %}" sizes="any">
    <style>
        :root {
            --bg: #0b0f14;
            --bg-alt: #111820;
            --panel: #141b22;
            --panel-strong: #0d1319;
            --line: rgba(255,255,255,0.08);
            --text: #f3f6f8;
            --muted: #a8b4be;
            --gold: #d7b15f;
            --gold-strong: #c79d3d;
            --shadow: 0 18px 40px rgba(0,0,0,0.35);
        }

        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at top, rgba(215,177,95,0.12), transparent 28%),
                linear-gradient(180deg, #0a0d12 0%, #0d1218 100%);
            color: var(--text);
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        a { color: inherit; }

        nav {
            position: sticky;
            top: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 42px;
            border-bottom: 1px solid var(--line);
            background: rgba(10, 13, 18, 0.9);
            backdrop-filter: blur(10px);
        }

        .logo-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .logo-img {
            height: 46px;
            width: auto;
            display: block;
        }

        .logo-text {
            font-size: clamp(1.1rem, 2vw, 1.8rem);
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--gold);
        }

        .nav-links {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        nav a {
            color: #edf3f9;
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.03em;
            transition: background 0.2s ease, color 0.2s ease;
        }

        nav a:hover {
            background: rgba(255,255,255,0.03);
            color: var(--gold);
        }

        .msg {
            max-width: 900px;
            margin: 22px auto;
            padding: 15px 18px;
            border: 1px solid rgba(126, 199, 133, 0.3);
            border-radius: 10px;
            background: rgba(19, 44, 30, 0.5);
            color: #d8f5de;
        }

        main {
            max-width: 1180px;
            margin: 0 auto;
            padding: 32px 24px 80px;
        }

        .auth-container {
            max-width: 520px;
            margin: 48px auto;
            padding: 28px;
            border-radius: 16px;
            background: rgba(20, 27, 34, 0.96);
            border: 1px solid var(--line);
            box-shadow: var(--shadow);
        }

        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            margin-bottom: 9px;
            font-size: 13px;
            font-weight: 700;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 10px;
            background: #0d141b;
            color: var(--text);
            font: inherit;
            box-sizing: border-box;
        }
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(215,177,95,0.12);
        }
        .btn-submit {
            width: 100%;
            border: none;
            border-radius: 10px;
            background: linear-gradient(180deg, var(--gold) 0%, var(--gold-strong) 100%);
            color: #111;
            font-weight: 800;
            padding: 14px 18px;
            cursor: pointer;
            transition: transform 0.2s ease, filter 0.2s ease;
        }
        .btn-submit:hover {
            transform: translateY(-1px);
            filter: brightness(1.02);
        }
    </style>
</head>
<body>

<nav>
    <div class="logo-wrap">
        <img src="{% static 'images/logo.png' %}" alt="MAREV STARS logo" class="logo-img">
        <div class="logo-text">MAREV STARS</div>
    </div>
    <div class="nav-links">
        <a href="{% url 'team:home' %}">Начало</a>
        <a href="{% url 'team:schedule' %}">Тренировки</a>
        <a href="{% url 'team:coaches' %}">Треньори</a>
        <a href="{% url 'team:contact' %}">Контакти</a>

        {% if user.is_authenticated and user.is_staff or user.is_superuser %}
            <a href="{% url 'team:staff_dashboard' %}" style="color: var(--gold-soft); font-weight: 800; border-left: 1px solid var(--line); padding-left: 15px;">
                 Staff Portal
            </a>
        {% endif %}
    </div>
</nav>



{% if messages %}
    {% for message in messages %}
        <div class="msg">{{ message }}</div>
    {% endfor %}
{% endif %}

<main style="padding: 40px; max-width: 1200px; margin: 0 auto;">
    {% block content %} {% endblock %}
</main>


</body>
</html>
