{% extends 'base.html' %}
{% block content %}
<div class="auth-container" style="max-width: 560px;">
    <h2 style="margin: 0 0 10px; text-align: center; color: var(--gold); font-size: clamp(1.8rem, 3vw, 2.5rem); text-transform: uppercase; letter-spacing: 0.08em;">
        Контакти
    </h2>
    <p style="margin: 0 0 24px; text-align: center; color: var(--muted); line-height: 1.7;">
        Имате въпроси? Свържете се директно с главния треньор.
    </p>

    <div style="padding: 18px 20px; background: rgba(255,255,255,0.02); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 24px;">
        <p style="margin: 0 0 10px; color: var(--text); font-size: 15px;">
            <strong style="color: var(--gold);">Телефон:</strong> +359899173417
        </p>
        <p style="margin: 0; color: var(--text); font-size: 15px;">
            <strong style="color: var(--gold);">Email:</strong> office@marevstars.com
        </p>
    </div>

    <form>
        <div class="form-group">
            <label>Съобщение</label>
            <textarea rows="5" placeholder="Напишете вашето съобщение..."></textarea>
        </div>
        <button type="button" class="btn-submit" onclick="alert('Message Sent!')">Send Message</button>
    </form>
</div>
{% endblock %}
