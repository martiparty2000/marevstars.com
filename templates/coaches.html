{% extends 'base.html' %}
{% load static %}
{% block content %}
<h2 style="color: var(--gold-soft); text-align: center; margin: 10px 0 38px; text-transform: uppercase; letter-spacing: 0.12em; font-size: 2rem;">
    Нашият треньорски състав
</h2>

<div style="display: flex; flex-wrap: wrap; gap: 22px; justify-content: center; padding-bottom: 20px;">
    {% for coach in coaches %}
    <div class="coach-card" style="background: rgba(20,29,39,0.9); border: 1px solid var(--line); border-radius: 16px; min-width: 280px; max-width: 340px; box-shadow: var(--shadow); overflow: hidden;">
        <img src="{% static 'images/'|add:coach.image %}" 
             alt="{{ coach.name }}" 
             style="width: 100%; height: 270px; object-fit: cover; display: block; background: #101821;">
        <div style="padding: 22px 20px 24px;">
            <h3 style="color: var(--gold-soft); margin: 0 0 10px; font-size: 1.5rem;">{{ coach.name }}</h3>
            <p style="font-weight: 700; color: #eaf1f6; margin: 0 0 14px; border-bottom: 1px solid var(--line); padding-bottom: 10px;">
                {{ coach.role }}
            </p>
            <p style="line-height: 1.65; color: var(--muted); font-size: 14px; margin: 0; text-align: left;">
                {{ coach.bio }}
            </p>
        </div>
    </div>
    {% empty %}
    <p style="color: #666;">Все още няма добавени треньори в базата данни.</p>
    {% endfor %}
</div>
{% endblock %}
