{% extends 'base.html' %}
{% load static %}
{% block content %}
<div style="padding-top: 14px;">
    <h2 style="margin: 0 0 30px; text-align: center; font-size: clamp(1.8rem, 3vw, 2.5rem); text-transform: uppercase; letter-spacing: 0.12em; color: var(--gold-soft);">
        Нашият треньорски състав
    </h2>

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 22px;">
        {% for coach in coaches %}
        <article style="background: rgba(18,24,31,0.96); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; box-shadow: 0 18px 40px rgba(0,0,0,0.3);">
            <img src="{% static 'images/'|add:coach.image %}" alt="{{ coach.name }}" style="display: block; width: 100%; height: 280px; object-fit: cover; background: #0c1015;">
            <div style="padding: 22px 20px 24px;">
                <h3 style="margin: 0 0 10px; color: #f3f5f7; font-size: 1.5rem;">{{ coach.name }}</h3>
                <p style="margin: 0 0 12px; color: var(--gold-soft); font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; font-size: 12px;">
                    {{ coach.role }}
                </p>
                <p style="margin: 0; color: var(--muted); line-height: 1.7; font-size: 14px;">
                    {{ coach.bio }}
                </p>
            </div>
        </article>
        {% empty %}
        <p style="color: #666;">Все още няма добавени треньори в базата данни.</p>
        {% endfor %}
    </div>
</div>
{% endblock %}
